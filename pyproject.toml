[project]
name = "ai-model-research-cli"
version = "1.0"
description = "Unofficial thin CLIs for AI model research: orexplorer (OpenRouter catalogue, batch, trending, benchmarks)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orexplorer = "orexplorer:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["orexplorer"]
